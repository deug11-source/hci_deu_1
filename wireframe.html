<title>여기맞캠 와이어프레임</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 3-column grid of phone frames, collapsing to 1 column on narrow screens */
:root{
  --bg:#f3f5f3; --fg:#1d2a24; --muted:#66756d; --accent:#2c7a55; --accent-ink:#fff;
  --screen:#fbfcfb; --line:#c9d3cd; --frame:#1d2a24; --ph:#e9eeea; --ph-line:#b7c4bc;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101613; --fg:#e6eee9; --muted:#97a69d; --accent:#5fbf92; --accent-ink:#0c1a13;
  --screen:#18201c; --line:#33423a; --frame:#5b6c62; --ph:#212b26; --ph-line:#3f4f46;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101613; --fg:#e6eee9; --muted:#97a69d; --accent:#5fbf92; --accent-ink:#0c1a13;
  --screen:#18201c; --line:#33423a; --frame:#5b6c62; --ph:#212b26; --ph-line:#3f4f46;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);
  padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}
h1{font-size:28px;font-weight:500;color:var(--accent);margin:0 0 10px;text-wrap:balance}
.lead{max-width:68ch;color:var(--muted);font-size:14px;line-height:1.65;margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px 24px}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
figcaption{font-size:14px;font-weight:500}
.phone{width:100%;max-width:320px;aspect-ratio:9/16.6;border:3px solid var(--frame);border-radius:26px;background:var(--screen);
  padding:10px 12px;display:flex;flex-direction:column;gap:9px;font-size:12px;overflow:hidden}
.status{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.bar{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px}
.bar small{font-weight:400;color:var(--muted);font-size:11px}
.box{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--screen);display:flex;justify-content:space-between;gap:8px;align-items:center;line-height:1.4}
.box.col{flex-direction:column;align-items:flex-start;gap:2px}
.box.hl{border-color:var(--accent)}
.box span.r{color:var(--muted);font-size:11px;white-space:nowrap}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:11px}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ph{flex:1;min-height:60px;border:1px dashed var(--ph-line);background:var(--ph);border-radius:6px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:11px;padding:8px;line-height:1.5;position:relative}
.btn{background:var(--accent);color:var(--accent-ink);border-radius:8px;text-align:center;padding:10px;font-weight:600;font-size:13px}
.tag{color:var(--accent);font-size:10.5px;font-weight:500}
.label{font-size:11px;color:var(--muted)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs span{flex:1;text-align:center;padding:6px 0;color:var(--muted)}
.tabs span.on{color:var(--accent);font-weight:600;border-bottom:2px solid var(--accent);margin-bottom:-1px}
.n{display:inline-flex;width:16px;height:16px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:10px;align-items:center;justify-content:center;margin-right:6px;flex:none}
.step{justify-content:flex-start}
.tiny{font-size:10px;color:var(--muted)}
.compass{position:absolute;top:8px;left:8px;border:1px solid var(--line);background:var(--screen);border-radius:5px;padding:2px 6px;font-size:10px;color:var(--fg)}
.dest{position:absolute;right:8px;top:36%;border:1px solid var(--fg);background:var(--screen);border-radius:5px;padding:2px 6px;font-size:10px;color:var(--fg)}
.me{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin-top:10px}
.plan{flex:1;display:flex;gap:8px;min-height:0}
.rooms{flex:1;border:1px dashed var(--ph-line);background:var(--ph);border-radius:6px;position:relative}
.rooms i{position:absolute;border:1px solid var(--fg);background:var(--screen);font-style:normal;font-size:10px;display:flex;align-items:center;justify-content:center}
.floors{display:flex;flex-direction:column;gap:5px}
.floors b{border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-size:10.5px;font-weight:400;text-align:center}
.floors b.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.out{background:transparent;color:var(--accent);border:1px solid var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<div class="wrap">
  <h1>여기맞캠? 와이어프레임</h1>
  <p class="lead">핵심 화면 6개의 구성을 저해상도로 그린 것입니다. 화면에 쓰인 건물명, 거리, 날짜는 구성을 보여주기 위한 예시이며 실제 동의대학교 데이터가 아닙니다. 초록색 표기(F1–F4, 공통)는 해당 화면이 담당하는 핵심 기능입니다.</p>
  <div class="grid">

    <figure><div class="phone">
      <div class="status"><span>9:41</span><span>●●●</span></div>
      <div class="bar"><span>여기맞캠?</span><small>동의대학교 ▾</small></div>
      <div class="box" style="justify-content:flex-start;color:var(--muted)">🔍 건물명·강의실 검색 (예: 인문관 110호)</div>
      <div class="pills"><span class="pill on">강의실</span><span class="pill">건물</span><span class="pill">편의시설</span></div>
      <div class="label">최근 검색</div>
      <div class="box"><span>인문관 110호</span><span class="r">1층</span></div>
      <div class="box"><span>학생식당</span><span class="r">B1</span></div>
      <div class="box"><span>아트홀</span><span class="r">3층</span></div>
      <div class="ph">현재 위치 주변 미니 지도</div>
      <div class="tag">F2 · 검색</div>
    </div><figcaption>① 홈 / 검색</figcaption></figure>

    <figure><div class="phone">
      <div class="status"><span>9:41</span><span>●●●</span></div>
      <div class="bar"><span>‹ 인문관 110호까지</span></div>
      <div class="ph" style="flex:1.6"><span class="compass">나침반 N ↑</span><span class="dest">목적지 ⚑</span>지도<br>(내 위치·바라보는 방향)<span class="me" style="position:absolute;bottom:14px">▲</span></div>
      <div class="box hl">지금 건물: 정보관 <span class="r">(목적지 건물 아님)</span></div>
      <div class="box" style="border:0;padding:0"><b>↗ 오른쪽 앞 · 180 m</b><span class="r">도보 약 3분</span></div>
      <div class="btn">경로 안내 시작</div>
      <div class="tag">F1 · 내 위치·방향</div>
    </div><figcaption>② 내 위치 지도</figcaption></figure>

    <figure><div class="phone">
      <div class="status"><span>9:41</span><span>●●●</span></div>
      <div class="bar"><span>‹ 경로 안내</span></div>
      <div class="tabs"><span class="on">경로</span><span>층별 지도</span><span>주변 보기</span></div>
      <div class="box step"><span><i class="n">1</i>정보관 앞에서 인문관 방향으로 직진 <span class="tiny">(180 m)</span></span></div>
      <div class="box step"><span><i class="n">2</i>인문관 1층 입구로 들어가기</span></div>
      <div class="box step hl"><span><i class="n">3</i>연결 통로로 2인문관으로 이동 <span class="tiny">(1층 복도 끝, 지름길)</span></span></div>
      <div class="box step"><span><i class="n">4</i>복도 끝까지 가면 110호</span></div>
      <div class="ph">실외 → 실내 경로 요약 그림</div>
      <div class="tag">F1 · F2 · F3 · 한 흐름으로 안내</div>
    </div><figcaption>③ 경로 안내</figcaption></figure>

    <figure><div class="phone">
      <div class="status"><span>9:41</span><span>●●●</span></div>
      <div class="bar"><span>‹ 인문관 · 층별 지도</span></div>
      <div class="plan">
        <div class="rooms"><span class="tiny" style="position:absolute;right:6px;top:4px">1층 평면도</span>
          <i style="left:12%;top:12%;width:62%;height:12%">복도</i>
          <i style="left:8%;top:44%;width:26%;height:18%">109호</i>
          <i style="left:46%;top:66%;width:36%;height:16%;border-color:var(--accent);border-width:2px">110호 ⚑</i>
          <span class="tiny" style="position:absolute;left:6px;bottom:4px">◀ 연결 통로 (2인문관)</span></div>
        <div class="floors"><b>4F</b><b>3F</b><b>2F</b><b class="on">1F</b><b>B1</b></div>
      </div>
      <div class="box col"><b>110호 · 1층 · 연결 통로를 지나 복도 끝</b><span class="tiny">정보 확인일: 2026.11 (운영진 검수)</span></div>
      <div class="tag">F2 · 층별 지도 / 지하는 B1 표기</div>
    </div><figcaption>④ 건물 상세 / 층별 지도</figcaption></figure>

    <figure><div class="phone">
      <div class="status"><span>9:41</span><span>●●●</span></div>
      <div class="bar"><span>‹ 주변 보기</span></div>
      <div class="tabs"><span>경로</span><span>층별 지도</span><span class="on">주변 보기</span></div>
      <div class="ph" style="flex:1.3">목적지 건물 입구 사진 / 로드뷰</div>
      <div class="box col hl"><b>정보관에서 걸어서 약 3분</b><span class="tiny">정문 쪽에서 보면 우측 도서관 오른쪽 건물</span></div>
      <div class="label">주변 랜드마크</div>
      <div class="box"><span>📚 중앙도서관</span><span class="r">120 m</span></div>
      <div class="box"><span>☕ 학생회관</span><span class="r">90 m</span></div>
      <div class="tag">F4 · 랜드마크 로드뷰</div>
    </div><figcaption>⑤ 주변 랜드마크 / 로드뷰</figcaption></figure>

    <figure><div class="phone">
      <div class="status"><span>9:41</span><span>●●●</span></div>
      <div class="bar"><span>‹ 정보 안내</span></div>
      <div class="box col"><b>인문관 1층 평면도</b><span class="tiny">출처: 학교 도면 · 공공 데이터<br>마지막 확인: 2026. 11. 05</span></div>
      <div class="box col"><b>1인문관–2인문관 연결 통로</b><span class="tiny">출처: 이용자 제보 → 운영진 검수 완료<br>마지막 확인: 2026. 11. 10</span></div>
      <div class="btn out">정보가 달라요 · 오류 제보하기</div>
      <div class="tiny">제보 내용은 운영진이 확인한 뒤 반영합니다.<br>질문 답변 기능은 제공하지 않습니다.</div>
      <div class="ph">제보 폼 (위치 선택, 사진, 설명)</div>
      <div class="tag">공통 · 정보 기준일과 제보</div>
    </div><figcaption>⑥ 정보 안내 / 오류 제보</figcaption></figure>

  </div>
</div>
